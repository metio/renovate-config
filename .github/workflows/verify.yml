name: Verify
on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      # default.json is a preset, not a standard Renovate config filename, so the validator cannot
      # auto-discover it — pass it explicitly. --strict fails on warnings, not just hard errors.
      - name: Validate preset
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 44.199.2
        run: npx --yes --package "renovate@$RENOVATE_VERSION" -- renovate-config-validator --strict default.json
  lint:
    name: Lint
    uses: metio/ci/.github/workflows/lint.yml@80c1f686b6d746e2a92aaa4cbfa657d85781fd34 # 2026.11.4080804
  verify:
    name: Verify
    needs: [validate, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify every job succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
